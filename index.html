<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Turma da Rua — Itaberá, 2019</title>
  <meta name="description" content="Jogo em pixel art sobre uma tarde de brincadeiras na rua em Itaberá (SP), 2019.">
  <link rel="stylesheet" href="./src/estilo.css">
  <link rel="icon" href="./assets/itens/token_futebol.png">
</head>
<body>
  <div id="jogo"></div>

  <!-- Rádio da Rua: barra no topo; o player oficial do YouTube fica pendurado nela enquanto toca -->
  <header id="radio" aria-label="Rádio da Rua">
    <div class="radio-barra">
      <span class="radio-icone" aria-hidden="true"></span>
      <strong id="radio-nome">Rádio da Rua</strong>
      <div class="radio-estacoes">
        <button data-estacao="lucas" title="Tocar a JBL do Lucas">JBL do Lucas</button>
        <button data-estacao="pedro" title="Tocar a JBL do Pedro">JBL do Pedro</button>
      </div>
      <div class="radio-botoes">
        <button id="radio-prev" title="Anterior">⏮</button>
        <button id="radio-play" title="Tocar/pausar (M)">▶</button>
        <button id="radio-next" title="Próxima">⏭</button>
      </div>
      <span id="radio-titulo">clique numa JBL pra tocar</span>
      <button id="radio-fechar" title="Pausar e recolher o player">▴</button>
    </div>
    <div id="radio-painel">
      <div id="radio-player"></div>
      <div id="radio-msg"></div>
      <ol id="radio-musicas"></ol>
    </div>
  </header>

  <script src="./lib/phaser.min.js"></script>
  <script src="./src/radio.js"></script>
  <script src="./src/comum.js"></script>
  <script src="./src/vizinhas.js"></script>
  <script src="./src/cenas/boot.js"></script>
  <script src="./src/cenas/abertura.js"></script>
  <script src="./src/cenas/rua.js"></script>
  <script src="./src/cenas/futebol.js"></script>
  <script src="./src/cenas/queimada.js"></script>
  <script src="./src/cenas/alerta.js"></script>
  <script src="./src/cenas/esconde.js"></script>
  <script src="./src/cenas/final.js"></script>
  <script src="./src/main.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
